name: Phase 4 - Automation & Agents
description: AI agents for routine tasks and workflow automation
title: "[Phase 4] <short description>"
labels: [AI, automation, agents, low-priority]

body:
  - type: textarea
    id: description
    attributes:
      description: Description
      placeholder: What agents will be created? What workflows will be automated?
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      description: Acceptance Criteria
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      description: Priority
      options:
        - Low
      default: Low
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      description: Issue Type
      options:
        - New Feature
        - Enhancement
    validations:
      required: true