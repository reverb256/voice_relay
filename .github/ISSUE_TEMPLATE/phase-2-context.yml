name: Phase 2 - Context Awareness
description: User context tracking across the desktop
title: "[Phase 2] <short description>"
labels: [AI, context, awareness, medium-priority]

body:
  - type: textarea
    id: description
    attributes:
      description: Description
      placeholder: What context will be tracked? How will suggestions improve?
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      description: Acceptance Criteria
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      description: Priority
      options:
        - Low
        - Medium
        - High
      default: Medium
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      description: Issue Type
      options:
        - New Feature
        - Enhancement
    validations:
      required: true